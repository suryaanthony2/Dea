<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>A question for Dea</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Figtree:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #fde8f0;
                --glow: #ffd0e2;
                --ink: #2a1245;
                --muted: #7a5a93;
                --accent: #e6246b;
                --accent-ink: #fff;
                --card: #ffffff;
                --chip: #f3d9ff;
                --line: #d9b8f0;
                --display: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
                --body:
                    'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
                color-scheme: light;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme='light']) {
                    --bg: #170b2b;
                    --glow: #3b1250;
                    --ink: #fbe9ff;
                    --muted: #c5a3de;
                    --accent: #ff4f93;
                    --accent-ink: #2a0a1c;
                    --card: #251243;
                    --chip: #3a1d63;
                    --line: #5a3a8a;
                    color-scheme: dark;
                }
            }
            :root[data-theme='dark'] {
                --bg: #170b2b;
                --glow: #3b1250;
                --ink: #fbe9ff;
                --muted: #c5a3de;
                --accent: #ff4f93;
                --accent-ink: #2a0a1c;
                --card: #251243;
                --chip: #3a1d63;
                --line: #5a3a8a;
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            :root {
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                background: var(--bg);
                background-image: radial-gradient(
                    60rem 36rem at 50% -10%,
                    var(--glow),
                    transparent 70%
                );
                color: var(--ink);
                font-family: var(--body);
                font-weight: 500;
                display: grid;
                place-items: center;
                padding: 1rem;
                overflow-x: hidden;
            }
            main {
                width: 100%;
                max-width: 34rem;
                text-align: center;
            }
            section[hidden] {
                display: none;
            }
            .face {
                font-size: 4.5rem;
                line-height: 1;
                display: inline-block;
                animation: bob 2.4s ease-in-out infinite;
                user-select: none;
            }
            .face.pop {
                animation: pop 0.5s ease;
            }
            @keyframes bob {
                50% {
                    transform: translateY(-0.5rem) rotate(-4deg);
                }
            }
            @keyframes pop {
                40% {
                    transform: scale(1.4) rotate(8deg);
                }
            }
            .hey {
                margin: 1rem 0 0.25rem;
                color: var(--muted);
                font-size: 1.1rem;
            }
            h1 {
                font-family: var(--display);
                font-weight: 700;
                font-size: clamp(2.8rem, 12vw, 4.4rem);
                line-height: 1.02;
                margin: 0 0 1.75rem;
                text-wrap: balance;
            }
            .row {
                display: flex;
                gap: 1rem;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
                min-height: 6rem;
            }
            button {
                font: inherit;
                font-weight: 700;
                cursor: pointer;
                border: 0;
                border-radius: 999px;
            }
            button:focus-visible,
            .chip:focus-visible {
                outline: 3px solid var(--ink);
                outline-offset: 3px;
            }
            .yes {
                background: var(--accent);
                color: var(--accent-ink);
                font-size: 1.2rem;
                padding: 0.8em 1.8em;
                box-shadow: 0 0.35rem 0 rgba(0, 0, 0, 0.18);
                transition:
                    font-size 0.25s,
                    transform 0.1s;
                max-width: 100%;
            }
            .yes:active {
                transform: translateY(0.2rem);
                box-shadow: 0 0.15rem 0 rgba(0, 0, 0, 0.18);
            }
            .slot {
                display: inline-block;
            }
            .no {
                background: transparent;
                color: var(--ink);
                border: 2px solid var(--line);
                font-size: 1.05rem;
                padding: 0.7em 1.5em;
                white-space: nowrap;
            }
            .no.flee {
                position: fixed;
                z-index: 5;
                transition:
                    left 0.22s cubic-bezier(0.3, 1.6, 0.5, 1),
                    top 0.22s cubic-bezier(0.3, 1.6, 0.5, 1);
                background: var(--card);
            }
            .no.gaveup {
                background: var(--chip);
                border-color: var(--accent);
            }
            .hint {
                min-height: 1.6em;
                margin: 1.25rem 0 0;
                color: var(--muted);
                font-size: 1.05rem;
            }
            h2 {
                font-family: var(--display);
                font-weight: 700;
                font-size: clamp(2.4rem, 10vw, 3.4rem);
                margin: 0.75rem 0 0.5rem;
                line-height: 1.05;
            }
            p.lede {
                margin: 0 0 1.5rem;
                color: var(--muted);
                font-size: 1.1rem;
            }
            fieldset {
                border: 0;
                padding: 0;
                margin: 0 0 1.5rem;
            }
            legend {
                font-weight: 700;
                margin: 0 auto 0.75rem;
                padding: 0;
                font-size: 1.1rem;
            }
            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 0.6rem;
                justify-content: center;
            }
            .chip {
                background: var(--chip);
                color: var(--ink);
                border: 2px solid transparent;
                font-size: 1rem;
                padding: 0.6em 1.1em;
                transition: transform 0.12s;
            }
            .chip:hover {
                transform: translateY(-2px);
            }
            .chip[aria-pressed='true'] {
                background: var(--accent);
                color: var(--accent-ink);
            }
            .ticket {
                background: var(--card);
                border: 2px dashed var(--accent);
                border-radius: 1.25rem;
                padding: 1.25rem 1rem;
                margin-top: 0.5rem;
            }
            .ticket b {
                font-family: var(--display);
                font-weight: 700;
                font-size: 2.1rem;
                line-height: 1.1;
                display: block;
                margin-bottom: 0.25rem;
            }
            .ticket span {
                color: var(--muted);
            }
            canvas {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 10;
            }
            @media (prefers-reduced-motion: reduce) {
                .face {
                    animation: none;
                }
                .no.flee {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <section id="ask">
                <div class="face" id="face" aria-hidden="true">😊</div>
                <p class="hey" id="hey">
                    Hey Dee, I had such a good time with you today.
                </p>
                <h1>Will you go on another date with me?</h1>
                <div class="row" id="row">
                    <button class="yes" id="yes" type="button">Yes 💕</button>
                    <span class="slot" id="slot"
                        ><button class="no" id="no" type="button">
                            No
                        </button></span
                    >
                </div>
                <p class="hint" id="hint" aria-live="polite"></p>
            </section>

            <section id="plan" hidden>
                <div class="face pop" aria-hidden="true">🥳</div>
                <h2 id="plan-title">Yay! You just made my day.</h2>
                <p class="lede">
                    Now the important decisions. Pick what sounds good:
                </p>
                <fieldset>
                    <legend>The vibe</legend>
                    <div class="chips" data-group="vibe">
                        <button class="chip" type="button" aria-pressed="false">
                            ☕ Coffee &amp; dessert
                        </button>
                        <button class="chip" type="button" aria-pressed="false">
                            🍜 Food crawl
                        </button>
                        <button class="chip" type="button" aria-pressed="false">
                            🎬 Movie night
                        </button>
                        <button class="chip" type="button" aria-pressed="false">
                            🛍️ Mall date, AC included
                        </button>
                        <button class="chip" type="button" aria-pressed="false">
                            🎲 Surprise me
                        </button>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>The day</legend>
                    <div class="chips" data-group="when">
                        <button class="chip" type="button" aria-pressed="false">
                            This weekend
                        </button>
                        <button class="chip" type="button" aria-pressed="false">
                            Next week
                        </button>
                        <button class="chip" type="button" aria-pressed="false">
                            Whenever you’re free
                        </button>
                    </div>
                </fieldset>
                <div class="ticket" id="ticket" hidden>
                    <b id="ticket-main"></b>
                    <span>Screenshot this and send it to me 📸</span>
                </div>
            </section>
        </main>
        <canvas id="fx" aria-hidden="true"></canvas>

        <script>
            (function () {
                var $ = function (id) {
                    return document.getElementById(id);
                };
                var no = $('no'),
                    yes = $('yes'),
                    slot = $('slot'),
                    hint = $('hint'),
                    face = $('face');
                var reduce = window.matchMedia(
                    '(prefers-reduced-motion: reduce)',
                ).matches;
                var misses = 0,
                    GIVE_UP = 10,
                    done = false;

                // Personalise: add #her-name to the end of the link
                var name = 'Dea';
                try {
                    name = decodeURIComponent((location.hash || '').slice(1))
                        .replace(/-/g, ' ')
                        .trim()
                        .slice(0, 30);
                } catch (e) {}
                if (name) {
                    $('hey').textContent =
                        'Hey ' +
                        name +
                        ', I had such a good time with you today.';
                    $('plan-title').textContent =
                        'Yay, ' + name + '! You just made my day.';
                }

                var lines = [
                    'Oops, that button’s shy 🙈',
                    'Nope, try again 😏',
                    'That one has commitment issues.',
                    'It’s not you, it’s the button.',
                    'Are you sure? Look how big Yes is getting.',
                    'The No button called in sick 🤒',
                    'Plot twist: it only moves for Yes.',
                    'Okay, you’re persistent. I like that.',
                    'Last chance, it’s getting tired…',
                ];
                var faces = [
                    '😊',
                    '😏',
                    '😳',
                    '😅',
                    '🫠',
                    '😬',
                    '😵‍💫',
                    '🤯',
                    '🫣',
                ];

                function dist(ax, ay, bx, by) {
                    return Math.hypot(ax - bx, ay - by);
                }

                function dodge(px, py) {
                    if (done) return;
                    misses++;
                    if (misses >= GIVE_UP) {
                        giveUp();
                        return;
                    }
                    if (!no.classList.contains('flee')) {
                        slot.style.width = no.offsetWidth + 'px';
                        slot.style.height = no.offsetHeight + 'px';
                        no.classList.add('flee');
                    }
                    var w = no.offsetWidth,
                        h = no.offsetHeight,
                        pad = 14;
                    var maxX = Math.max(pad, innerWidth - w - pad),
                        maxY = Math.max(pad, innerHeight - h - pad);
                    var yr = yes.getBoundingClientRect(),
                        x,
                        y,
                        t = 0,
                        ok;
                    do {
                        x = pad + Math.random() * (maxX - pad);
                        y = pad + Math.random() * (maxY - pad);
                        t++;
                        var far =
                            px == null ||
                            dist(x + w / 2, y + h / 2, px, py) > 200;
                        var clear =
                            x + w < yr.left - 20 ||
                            x > yr.right + 20 ||
                            y + h < yr.top - 20 ||
                            y > yr.bottom + 20;
                        ok = far && clear;
                    } while (!ok && t < 40);
                    no.style.left = x + 'px';
                    no.style.top = y + 'px';
                    yes.style.fontSize =
                        Math.min(1.2 + misses * 0.11, 2.3) + 'rem';
                    hint.textContent = lines[(misses - 1) % lines.length];
                    face.textContent =
                        faces[Math.min(misses, faces.length - 1)];
                }

                function giveUp() {
                    no.classList.remove('flee');
                    no.style.left = no.style.top = '';
                    slot.style.width = slot.style.height = '';
                    no.classList.add('gaveup');
                    no.textContent = 'Okay, fine. Yes 💕';
                    no.setAttribute('data-yes', '1');
                    hint.textContent = 'The No button gave up. Your move.';
                    face.textContent = '😏';
                    yes.style.fontSize = '1.4rem';
                }

                document.addEventListener('pointermove', function (e) {
                    if (
                        done ||
                        e.pointerType !== 'mouse' ||
                        no.getAttribute('data-yes')
                    )
                        return;
                    var r = no.getBoundingClientRect();
                    if (
                        dist(
                            e.clientX,
                            e.clientY,
                            r.left + r.width / 2,
                            r.top + r.height / 2,
                        ) <
                        Math.max(r.width, r.height) / 2 + 55
                    )
                        dodge(e.clientX, e.clientY);
                });
                no.addEventListener('pointerdown', function (e) {
                    if (no.getAttribute('data-yes')) return;
                    e.preventDefault();
                    dodge(e.clientX, e.clientY);
                });
                no.addEventListener('focus', function () {
                    if (no.getAttribute('data-yes')) return;
                    dodge(null, null);
                    no.blur();
                });
                no.addEventListener('click', function (e) {
                    if (no.getAttribute('data-yes')) {
                        sayYes();
                        return;
                    }
                    e.preventDefault();
                    dodge(null, null);
                });
                yes.addEventListener('click', sayYes);

                function sayYes() {
                    if (done) return;
                    done = true;
                    $('ask').hidden = true;
                    $('plan').hidden = false;
                    window.scrollTo(0, 0);
                    confetti();
                }

                // Date picker
                var picks = { vibe: '', when: '' };
                document.querySelectorAll('.chips').forEach(function (group) {
                    group.addEventListener('click', function (e) {
                        var b = e.target.closest('.chip');
                        if (!b) return;
                        group.querySelectorAll('.chip').forEach(function (c) {
                            c.setAttribute('aria-pressed', 'false');
                        });
                        b.setAttribute('aria-pressed', 'true');
                        picks[group.getAttribute('data-group')] = b.textContent;
                        if (picks.vibe && picks.when) {
                            $('ticket-main').textContent =
                                'Date #2: ' +
                                picks.vibe +
                                ', ' +
                                picks.when.charAt(0).toLowerCase() +
                                picks.when.slice(1);
                            $('ticket').hidden = false;
                            $('ticket').scrollIntoView({
                                behavior: reduce ? 'auto' : 'smooth',
                                block: 'nearest',
                            });
                        }
                    });
                });

                // Confetti
                function confetti() {
                    if (reduce) return;
                    var c = $('fx'),
                        ctx = c.getContext('2d'),
                        dpr = window.devicePixelRatio || 1;
                    c.width = innerWidth * dpr;
                    c.height = innerHeight * dpr;
                    ctx.scale(dpr, dpr);
                    var cols = [
                            '#e6246b',
                            '#ffc24a',
                            '#7b4dff',
                            '#2ec4b6',
                            '#ff8fb8',
                        ],
                        ps = [],
                        i;
                    for (i = 0; i < 140; i++)
                        ps.push({
                            x: innerWidth / 2,
                            y: innerHeight * 0.35,
                            vx: (Math.random() - 0.5) * 14,
                            vy: -Math.random() * 13 - 3,
                            s: 5 + Math.random() * 7,
                            r: Math.random() * 6,
                            vr: (Math.random() - 0.5) * 0.3,
                            c: cols[i % cols.length],
                        });
                    var t0 = performance.now();
                    (function tick(now) {
                        var el = now - t0;
                        ctx.clearRect(0, 0, innerWidth, innerHeight);
                        ps.forEach(function (p) {
                            p.vy += 0.25;
                            p.x += p.vx;
                            p.y += p.vy;
                            p.r += p.vr;
                            p.vx *= 0.99;
                            ctx.save();
                            ctx.translate(p.x, p.y);
                            ctx.rotate(p.r);
                            ctx.fillStyle = p.c;
                            ctx.globalAlpha = Math.max(0, 1 - el / 3200);
                            ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
                            ctx.restore();
                        });
                        if (el < 3200) requestAnimationFrame(tick);
                        else ctx.clearRect(0, 0, innerWidth, innerHeight);
                    })(t0);
                }
            })();
        </script>
    </body>
</html>
